<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sommaire des CSS </title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            text-align: center;
        }

        header {
            padding: 50px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
        }

        .card {
            background: white;
            color: #333;
            padding: 20px;
            margin: 15px 0;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card a {
            text-decoration: none;
            font-weight: bold;
            color: #1e3c72;
            font-size: 1.2rem;
        }

        .card a:hover {
            color: #ff6600;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>📘 Sommaire des Cours CSS</h1>
    <p>Choisissez un chapitre</p>
</header>

<div class="container">

    <div class="card">
        <a href="DOCS\CSS\cour1css.html">cour 1</a>
    </div>

    <div class="card">
        <a href="DOCS\CSS\cour2css.html">cour 2</a>
    </div>

</div>

<footer>
    © 2026 – Plateforme Cours HTML
</footer>

</body>
</html>
